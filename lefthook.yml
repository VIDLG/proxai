pre-commit:
  parallel: false
  commands:
    fmt:
      root: "."
      run: just ci-fmt-check
    clippy:
      root: "."
      run: just ci-clippy

pre-push:
  commands:
    release-tag-version:
      root: "."
      run: just ci-check-release-tag-version
    test-lib:
      root: "."
      run: just ci-test-lib
