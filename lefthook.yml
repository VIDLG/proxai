pre-commit:
  parallel: false
  commands:
    fmt:
      root: "."
      run: just ci-fmt-check
    clippy:
      root: "."
      run: just ci-clippy

pre-push:
  commands:
    release-tag-version:
      root: "."
      run: just check_release_tag_version
    test-lib:
      root: "."
      run: just test_lib
