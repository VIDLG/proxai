[package]
name = "proxai-core"
version = "0.8.0"
edition = "2024"
description = "Carrier-independent protocol models and translation for proxai"
repository = "https://github.com/VIDLG/proxai"
publish = false

[dependencies]
async-stream = "0.3"
delegate = "0.13"
derive_more = { version = "2", features = ["from"] }
futures-util = "0.3"
getset = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
